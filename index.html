<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Нормативы">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<title>Нормативы</title>
<style>
:root{
  --bg:#f6f6f3; --card:#ffffff; --text:#1a1a1a; --muted:#6b6b66; --line:#e4e4de;
  --chip:#efefea; --chip-on:#1a1a1a; --chip-on-text:#ffffff;
  --g5:#1f9d55; --g4:#2f6fd6; --g3:#c98a00; --g2:#d64545;
  --g5bg:#e3f5ea; --g4bg:#e5eefc; --g3bg:#fbf1d9; --g2bg:#fbe4e4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141414; --card:#1e1e1e; --text:#f0f0ec; --muted:#9a9a94; --line:#2e2e2c;
    --chip:#262625; --chip-on:#f0f0ec; --chip-on-text:#141414;
    --g5:#3ecf7a; --g4:#6c9cf0; --g3:#e8b030; --g2:#f07070;
    --g5bg:#16301f; --g4bg:#1a2640; --g3bg:#33290f; --g2bg:#3a1a1a;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding:16px 16px calc(24px + env(safe-area-inset-bottom));
}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:22px;font-weight:700;margin:4px 0 16px}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:0;background:var(--chip);color:var(--text);font:inherit;font-weight:600;
  border-radius:10px;padding:10px 0;min-width:44px;cursor:pointer;flex:1 0 44px;
}
.chip.on{background:var(--chip-on);color:var(--chip-on-text)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-weight:600;padding:10px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ex button{
  text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);
  font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;cursor:pointer;line-height:1.25;
}
.ex button.on{border-color:var(--chip-on);box-shadow:inset 0 0 0 1px var(--chip-on)}
.ex small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:18px}
.card h2{font-size:17px;font-weight:700}
.card .sub{color:var(--muted);font-size:13px;margin-top:2px}
.inp{display:flex;gap:10px;align-items:stretch;margin-top:14px}
.inp input{
  flex:1;min-width:0;font:inherit;font-size:28px;font-weight:600;padding:10px 14px;
  border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);
}
.inp input:focus{outline:2px solid var(--chip-on);outline-offset:-1px}
.grade{
  width:84px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:44px;font-weight:800;background:var(--chip);color:var(--muted);
}
.grade.g5{background:var(--g5bg);color:var(--g5)}
.grade.g4{background:var(--g4bg);color:var(--g4)}
.grade.g3{background:var(--g3bg);color:var(--g3)}
.grade.g2{background:var(--g2bg);color:var(--g2)}
.hint{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.thr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.thr div{border-radius:10px;padding:8px;text-align:center;background:var(--chip)}
.thr b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.thr span{font-size:17px;font-weight:700}
.thr div.hit{outline:2px solid currentColor}
.thr .t5.hit{color:var(--g5);background:var(--g5bg)}
.thr .t4.hit{color:var(--g4);background:var(--g4bg)}
.thr .t3.hit{color:var(--g3);background:var(--g3bg)}
.thr div.hit b{color:inherit}
.next{font-size:14px;margin-top:10px;font-weight:600}
.free{margin-top:14px;font-size:18px;font-weight:600;color:var(--muted)}
[hidden]{display:none!important}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
footer{color:var(--muted);font-size:12px;margin-top:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Нормативы по физкультуре</h1>

  <div class="label">Класс</div>
  <div class="row" id="classes"></div>

  <div class="label">Пол</div>
  <div class="seg" id="gender">
    <button data-g="m">Мальчики</button>
    <button data-g="f">Девочки</button>
  </div>

  <div class="label">Норматив</div>
  <div class="ex" id="exlist"></div>

  <div class="card" id="calc" hidden>
    <h2 id="exname"></h2>
    <div class="sub" id="exsub"></div>
    <div class="inp" id="inpbox">
      <input id="val" inputmode="decimal" autocomplete="off" enterkeyhint="done">
      <div class="grade" id="grade">–</div>
    </div>
    <div class="free" id="free" hidden>Без учёта времени</div>
    <div class="hint" id="hint"></div>
    <div class="thr" id="thr"></div>
    <div class="next" id="next"></div>
  </div>

  <footer>По таблицам школы: 1–4 кл. (Лях, Зданевич), 5–11 кл. Цифры — как в таблицах.</footer>
</div>

    R('Челночный бег 4×9 м', 'сек', ['9,2','9,6','10,1'], ['9,8','10,2','11,0']),
    R('Бег 30 м', 'сек', ['4,4','4,7','5,1'], ['5,0','5,3','5,7']),
    R('Бег 1000 м', 'сек', ['3,30','3,50','4,20'], null),
    R('Бег 500 м', 'сек', null, ['2,1','2,2','2,5']),
    R('Бег 100 м', 'сек', ['13,8','14,2','15,0'], ['16,2','17,0','18,0']),
    R('Бег 2000 м', 'мин', null, ['10,00','11,10','12,20']),
    R('Бег 3000 м', 'мин', ['12,20','13,00','14,00'], null),
    R('Прыжки в длину с места', 'см', ['230','220','200'], ['185','170','155']),
    R('Подтягивание на высокой перекладине', 'раз', ['14','11','8'], null),
    R('Сгибание и разгибание рук в упоре', 'раз', ['32','27','22'], ['20','15','10']),
    R('Наклоны вперёд из положения сидя', 'см', ['15','13','8'], ['24','20','13']),
    R('Подъём туловища за 1 мин лёжа', 'раз', ['55','49','45'], ['42','36','30']),
    R('Бег на лыжах 1 км', 'мин', ['4,3','4,50','5,20'], ['5,45','6,15','7,00']),
    R('Бег на лыжах 2 км', 'мин', ['10,20','10,40','11,10'], ['12,00','12,45','13,30']),
    R('Бег на лыжах 3 км', 'мин', ['14,30','15,00','15,50'], ['18,00','19,00','20,00']),
    R('Бег на лыжах 5 км', 'мин', ['25,00','26,00','28,00'], Z),
    R('Бег на лыжах 10 км', 'мин', Z, null),
    R('Прыжок на скакалке, 30 сек', 'раз', ['70','65','55'], ['80','75','65']),
  ],
};

// Числа сравниваются ровно так, как они записаны в таблице (запятая = точка)
const num = s => parseFloat(String(s).trim().replace(',', '.').replace(':', '.'));

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

let cls = +store.get('cls') || 11;
let gen = store.get('gen') === 'f' ? 'f' : 'm';
let exName = store.get('ex') || null;

const $ = id => document.getElementById(id);

function exercises() { return DATA[cls].filter(e => e[gen]); }

function renderClasses() {
  $('classes').innerHTML = Object.keys(DATA).map(c =>
    `<button class="chip${+c === cls ? ' on' : ''}" data-c="${c}">${c}</button>`).join('');
}
function renderGender() {
  document.querySelectorAll('#gender button').forEach(b => b.classList.toggle('on', b.dataset.g === gen));
}
function renderList() {
  const list = exercises();
  if (!list.some(e => e.name === exName)) exName = null;
  $('exlist').innerHTML = list.length ? list.map(e =>
    `<button class="${e.name === exName ? 'on' : ''}" data-e="${e.name}">${e.name}<small>${e[gen] === Z ? 'без учёта' : e.unit}</small></button>`).join('')
    : '<div class="empty">Нет нормативов</div>';
  renderCalc();
}

function renderCalc() {
  const e = exercises().find(x => x.name === exName);
  $('calc').hidden = !e;
  if (!e) return;
  const free = e[gen] === Z;
  $('exname').textContent = e.name;
  $('exsub').textContent = `${cls} класс · ${gen === 'm' ? 'мальчики' : 'девочки'}` + (e.unit ? ' · ' + e.unit : '');
  $('inpbox').hidden = free;
  $('free').hidden = !free;
  $('val').placeholder = /мин|сек/.test(e.unit) && /,\d\d/.test((e[gen] || [])[0]) ? 'например 3,45' : 'введите результат';
  compute();
}

function compute() {
  const e = exercises().find(x => x.name === exName);
  if (!e || e[gen] === Z) { $('thr').innerHTML = ''; $('next').textContent = ''; return; }
  const raw = e[gen];
  const t = raw.map(num);
  const lower = t[0] < t[2];
  const ok = (v, th) => lower ? v <= th : v >= th;

  const s = $('val').value;
  const v = s.trim() === '' ? null : num(s);
  const valid = v !== null && !isNaN(v);

  let g = null;
  if (valid) g = ok(v, t[0]) ? 5 : ok(v, t[1]) ? 4 : ok(v, t[2]) ? 3 : 2;

  const gEl = $('grade');
  gEl.className = 'grade' + (g ? ' g' + g : '');
  gEl.textContent = g || '–';
  $('hint').textContent = v !== null && !valid ? 'Не понял число' : '';

  $('thr').innerHTML = [5, 4, 3].map((n, i) =>
    `<div class="t${n}${g === n ? ' hit' : ''}"><b>«${n}»</b><span>${raw[i]}</span></div>`).join('');
  $('next').textContent = '';
}

$('classes').addEventListener('click', ev => {
  const b = ev.target.closest('[data-c]'); if (!b) return;
  cls = +b.dataset.c; store.set('cls', cls); renderClasses(); renderList();
});
$('gender').addEventListener('click', ev => {
  const b = ev.target.closest('[data-g]'); if (!b) return;
  gen = b.dataset.g; store.set('gen', gen); renderGender(); renderList();
});
$('exlist').addEventListener('click', ev => {
  const b = ev.target.closest('[data-e]'); if (!b) return;
  exName = b.dataset.e; store.set('ex', exName); $('val').value = ''; renderList();
  $('calc').scrollIntoView({behavior: 'smooth', block: 'nearest'});
  if (exercises().find(x => x.name === exName)[gen] !== Z) $('val').focus();
});
$('val').addEventListener('input', compute);
$('val').addEventListener('keydown', ev => { if (ev.key === 'Enter') ev.target.blur(); });

renderClasses(); renderGender(); renderList();
</script>
</body>
</html>
